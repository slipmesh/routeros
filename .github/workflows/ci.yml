# Pull requests and pushes run the checks; only a merged release PR is built, in its own run, and
# released with the binaries that build produced.
name: CI

on:
  push:
    branches: [main, "release-*"]
  pull_request:
  # cargo audit depends on the advisory database, not on the commit.
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    uses: slipmesh/.github/.github/workflows/rust.yml@v2

  release-commit:
    if: github.event_name == 'push'
    uses: slipmesh/.github/.github/workflows/release-commit.yml@v2

  build:
    needs: [release-commit, checks]
    if: needs.release-commit.outputs.version != ''
    uses: slipmesh/.github/.github/workflows/rust-build.yml@v2
    with:
      binaries: slipmesh-routeros

  tag:
    needs: [release-commit, build]
    uses: slipmesh/.github/.github/workflows/tag-release.yml@v2
    permissions:
      contents: write
    with:
      version: ${{ needs.release-commit.outputs.version }}

  release:
    needs: [release-commit, tag]
    uses: slipmesh/.github/.github/workflows/release.yml@v2
    permissions:
      contents: write
    with:
      tag: ${{ needs.release-commit.outputs.version }}
      latest: ${{ github.ref == 'refs/heads/main' && needs.release-commit.outputs.prerelease != 'true' }}
      prerelease: ${{ needs.release-commit.outputs.prerelease == 'true' }}
      download-binaries: true
      prepare: |
        mkdir dist
        for arch in amd64 arm64; do
          cp "binaries/$arch/release/slipmesh-routeros" "dist/slipmesh-routeros-linux-$arch"
        done
        (cd dist && sha256sum -- * > SHA256SUMS)
      assets: dist/slipmesh-routeros-linux-amd64 dist/slipmesh-routeros-linux-arm64 dist/SHA256SUMS
