# There is no image to copy a release out of, so the run that releases builds and tests the
# binaries it attaches.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    uses: slipmesh/.github/.github/workflows/rust.yml@v1.2
    with:
      binaries: slipmesh-routeros

  tag:
    needs: rust
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: slipmesh/.github/.github/workflows/tag-release.yml@v1.2
    permissions:
      contents: write

  # Runs for a release commit tagged above, or for a tag pushed by hand.
  release:
    needs: [rust, tag]
    if: ${{ !cancelled() && needs.rust.result == 'success' && (github.ref_type == 'tag' || needs.tag.outputs.tag != '') }}
    uses: slipmesh/.github/.github/workflows/release.yml@v1.2
    permissions:
      contents: write
      packages: read
    with:
      tag: ${{ needs.tag.outputs.tag }}
      download-binaries: true
      prepare: |
        mkdir dist
        for arch in amd64 arm64; do
          cp "binaries/$arch/release/slipmesh-routeros" "dist/slipmesh-routeros-linux-$arch"
        done
        (cd dist && sha256sum -- * > SHA256SUMS)
      assets: dist/slipmesh-routeros-linux-amd64 dist/slipmesh-routeros-linux-arm64 dist/SHA256SUMS
