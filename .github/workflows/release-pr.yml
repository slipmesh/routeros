name: Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, vX.Y.Z+sm.N with X.Y.Z the current Talos patch of the branch's line.
        required: true

permissions:
  contents: read

jobs:
  release-pr:
    uses: slipmesh/.github/.github/workflows/release-pr.yml@v2.3
    permissions:
      contents: write
      pull-requests: write
    with:
      version: ${{ inputs.version }}
      bump: sed -i "s/^version = \".*\"/version = \"$VERSION_NUMBER\"/" Cargo.toml
