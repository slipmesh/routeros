[package]
name = "routeros"
version = "0.1.0"
edition = "2024"
authors = ["Evgeniy Slizevich <evgeniy@slizevich.net>"]
# AGPL-3.0-only, not MIT/Apache-2.0 like the sibling slipmesh-operators/slipmesh-core repos: this
# binary depends on mikrotik-rs, whose whole workspace (mikrotik-rs/mikrotik-proto/mikrotik-tokio)
# is AGPL-3.0-only - any binary linking it must itself be AGPL-3.0-compatible. See AGENTS.md.
license = "AGPL-3.0-only"
description = "One-shot CLI tool that converges a MikroTik RouterOS device to the desired state computed by talos-extensions/patches from mesh.yaml"
repository = "https://github.com/slipmesh/routeros"

[[bin]]
name = "slipmesh-routeros"
path = "src/main.rs"

[dependencies]
# Local path deps: talos-extensions has no git remote yet. Switch to a pinned git rev (mirroring
# how slipmesh-core used to be pinned) once one exists - see AGENTS.md.
awg = { path = "../talos-extensions/awg" }
router = { path = "../talos-extensions/router" }

mikrotik-rs = { version = "0.8.0", features = ["tokio-tls"] }

anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
