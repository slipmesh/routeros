[package]
name = "routeros"
version = "0.1.0"
edition = "2024"
authors = ["slipmesh"]
# AGPL-3.0-only, unlike every other repository in this organization: this binary depends on
# mikrotik-rs, whose whole workspace (mikrotik-rs/mikrotik-proto/mikrotik-tokio) is AGPL-3.0-only
# - any binary linking it must itself be AGPL-3.0-compatible.
license = "AGPL-3.0-only"
description = "One-shot CLI tool that converges a MikroTik RouterOS device to the desired state computed by talos-extensions/patches from mesh.yaml"
repository = "https://github.com/slipmesh/routeros"

[[bin]]
name = "slipmesh-routeros"
path = "src/main.rs"

[dependencies]
# Local path deps on a sibling talos-extensions checkout, so a build here always compiles against
# that repository's current source - this tool has to agree with the daemons field for field, and
# depends on their own config types rather than restating them. A pinned git rev would decouple the
# two; until then, both this repo's release workflow and a local build need the checkout present.
awg = { path = "../talos-extensions/awg" }
router = { path = "../talos-extensions/router" }

base64 = "0.22"
mikrotik-rs = { version = "0.8.0", features = ["tokio-tls"] }

anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws-lc-rs"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
