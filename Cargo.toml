[package]
name = "routeros"
version = "0.2.2"
edition = "2024"
authors = ["slipmesh"]
# AGPL-3.0-only, unlike every other repository in this organization: this binary depends on
# mikrotik-rs, whose whole workspace (mikrotik-rs/mikrotik-proto/mikrotik-tokio) is AGPL-3.0-only
# - any binary linking it must itself be AGPL-3.0-compatible.
license = "AGPL-3.0-only"
description = "One-shot CLI tool that converges a MikroTik RouterOS device to the desired state computed by slipmesh-taloscfg from slipmesh.yaml"
repository = "https://github.com/slipmesh/routeros"

[[bin]]
name = "slipmesh-routeros"
path = "src/main.rs"

[dependencies]
# This tool has to agree with the daemons field for field, so it uses their own config types. The
# tag names the talos-extensions release whose config format it targets.
awg = { git = "https://github.com/slipmesh/talos-extensions", tag = "v0.4.0", default-features = false }
router = { git = "https://github.com/slipmesh/talos-extensions", tag = "v0.4.0", default-features = false }

base64 = "0.23"
mikrotik-rs = { version = "0.9.0", features = ["tokio-tls"] }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws-lc-rs"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
yaml_serde = "0.10.7"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
