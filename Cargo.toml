[package]
name = "routeros"
version = "0.2.4"
edition = "2024"
authors = ["slipmesh"]
# AGPL-3.0-only, unlike every other repository in this organization: this binary depends on
# mikrotik-rs, whose whole workspace (mikrotik-rs/mikrotik-proto/mikrotik-tokio) is AGPL-3.0-only
# - any binary linking it must itself be AGPL-3.0-compatible.
license = "AGPL-3.0-only"
description = "One-shot CLI tool that converges a MikroTik RouterOS device to the desired state computed by slipmesh-taloscfg from slipmesh.yaml"
repository = "https://github.com/slipmesh/routeros"
# Installed from a release or by git tag, never from crates.io.
publish = false

[[bin]]
name = "slipmesh-routeros"
path = "src/main.rs"

[dependencies]
# Ours, from a release tag: sliplib is not published to crates.io.
# The patch format, shared with the generator and the daemons field for field.
sliplib-config = { git = "https://github.com/slipmesh/sliplib", rev = "8f523c83bd60f5696cecfbfb10c522aa04901e34" }
sliplib-net = { git = "https://github.com/slipmesh/sliplib", rev = "8f523c83bd60f5696cecfbfb10c522aa04901e34" }
sliplib-runtime = { git = "https://github.com/slipmesh/sliplib", rev = "8f523c83bd60f5696cecfbfb10c522aa04901e34", default-features = false }
sliplib-secrets = { git = "https://github.com/slipmesh/sliplib", rev = "8f523c83bd60f5696cecfbfb10c522aa04901e34" }
sliplib-yaml = { git = "https://github.com/slipmesh/sliplib", rev = "8f523c83bd60f5696cecfbfb10c522aa04901e34" }
mikrotik-rs = { version = "0.10.0", features = ["tokio-tls"] }

anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"
