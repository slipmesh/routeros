# The same list as deny.toml's [licenses] allow: cargo-about cannot read that file, and --fail
# refuses a crate under a license missing here.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "AGPL-3.0-only",
]

# Ours, so not third-party: the crates `publish = false` marks.
[private]
ignore = true
